name: Bug report
description: Something in the code or tooling does not work as documented.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, inputs or a minimal example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, database (SQLite or PostgreSQL), browser if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets before pasting.
      render: shell
    validations:
      required: false
